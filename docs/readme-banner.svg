<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">Jev Prompt Enhancer — clearer prompts, better starts</title>
  <desc id="desc">Give your coding agent a clearer task. Measure, refine, recheck, then build. Default target: 80 out of 100, with up to three enhancement attempts.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#10182d"/>
      <stop offset="1" stop-color="#172d43"/>
    </linearGradient>
    <linearGradient id="accent">
      <stop stop-color="#65ead4"/>
      <stop offset="1" stop-color="#a5b4fc"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="480" rx="24" fill="url(#background)"/>
  <circle cx="1110" cy="40" r="220" fill="#65ead4" opacity=".04"/>
  <circle cx="1110" cy="40" r="160" fill="none" stroke="#65ead4" opacity=".12"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="56" y="44" width="208" height="32" rx="16" fill="#23394b"/>
    <circle cx="75" cy="60" r="4" fill="#65ead4"/>
    <text x="89" y="65" fill="#c5f5ed" font-size="12" font-weight="700" letter-spacing="1.5">JEV PROMPT ENHANCER</text>
    <text x="56" y="146" fill="#f5f7ff" font-size="52" font-weight="700">Clearer prompts.</text>
    <text x="56" y="205" fill="url(#accent)" font-size="52" font-weight="700">Better starts.</text>
    <text x="58" y="250" fill="#c4d0e1" font-size="20">Give your coding agent a clearer task</text>
    <text x="58" y="278" fill="#c4d0e1" font-size="20">before it writes the first line.</text>
    <rect x="816" y="94" width="328" height="190" rx="18" fill="#101d31" stroke="#3d536b"/>
    <text x="844" y="129" fill="#c4d0e1" font-size="13" letter-spacing="2">DEFAULT QUALITY TARGET</text>
    <text x="844" y="198" fill="#65ead4" font-size="60" font-weight="700">80<tspan fill="#b3c3d9" font-size="28" font-weight="400"> / 100</tspan></text>
    <text x="844" y="239" fill="#c4d0e1" font-size="16">Up to 3 enhancement attempts.</text>
    <text x="844" y="263" fill="#c4d0e1" font-size="16">Your intent stays at the center.</text>
    <path d="M58 321H1142" stroke="#3d536b"/>
    <g fill="#16263b" stroke="#3d536b">
      <rect x="56" y="351" width="244" height="70" rx="12"/>
      <rect x="337" y="351" width="244" height="70" rx="12"/>
      <rect x="618" y="351" width="244" height="70" rx="12"/>
      <rect x="899" y="351" width="244" height="70" rx="12"/>
    </g>
    <g fill="#65ead4" font-size="14" font-weight="700">
      <text x="78" y="391">01</text>
      <text x="359" y="391">02</text>
      <text x="640" y="391">03</text>
      <text x="921" y="391">04</text>
    </g>
    <g fill="#f5f7ff" font-size="23" font-weight="600">
      <text x="113" y="394">Measure</text>
      <text x="394" y="394">Refine</text>
      <text x="675" y="394">Recheck</text>
      <text x="956" y="394">Build</text>
    </g>
    <path d="M309 386h18m-6-6 6 6-6 6 M590 386h18m-6-6 6 6-6 6 M871 386h18m-6-6 6 6-6 6" fill="none" stroke="#8fa9c4" stroke-width="2"/>
  </g>
</svg>
